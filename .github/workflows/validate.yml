name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: |
          bunx prettier --write \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx \
            supabase/migrations/20260715214500_create_agenda_events.sql

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bunx tsc --noEmit 2>&1 | tee typescript.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log

      - name: Lint changed files
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bunx eslint \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx \
            2>&1 | tee lint.log

      - name: Upload validation reports and formatted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            typescript.log
            build.log
            lint.log
            src/lib/agenda.ts
            src/lib/attendances.functions.ts
            src/lib/error-message.ts
            src/lib/official-templates.ts
            src/lib/processes.ts
            src/routes/_authed.agenda.tsx
            src/routes/_authed.atendimento.$id.tsx
            src/routes/_authed.atendimento.novo.tsx
            src/routes/_authed.modelos.tsx
            src/routes/_authed.tsx
            supabase/migrations/20260715214500_create_agenda_events.sql
          retention-days: 7

      - name: Validation gate
        if: always()
        env:
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          if [ "$TYPESCRIPT_OUTCOME" != "success" ] || [ "$BUILD_OUTCOME" != "success" ] || [ "$LINT_OUTCOME" != "success" ]; then
            echo "Validation failed: TypeScript=$TYPESCRIPT_OUTCOME Build=$BUILD_OUTCOME Lint=$LINT_OUTCOME"
            exit 1
          fi
