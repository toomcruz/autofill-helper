name: Fix triagem JSON type

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/triagem-source-of-truth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/triagem-source-of-truth
          fetch-depth: 0

      - name: Fix Supabase JSON typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authed.atendimento.$id.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'extracted_data: buildPersistedExtractedData(att.extracted_data, fields, effectiveMeta),'
          new = 'extracted_data: buildPersistedExtractedData(att.extracted_data, fields, effectiveMeta) as never,'
          count = text.count(old)
          if count == 3:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif count == 0 and text.count(new) == 3:
              print('Tipagem JSON já aplicada.')
          else:
              raise SystemExit(f'Estado inesperado: old={count}, new={text.count(new)}')
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format route
        run: bunx prettier --write 'src/routes/_authed.atendimento.$id.tsx'

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authed.atendimento.$id.tsx'
          if git diff --cached --quiet; then
            echo "Tipagem já estava gravada."
          else
            git commit -m "fix: tipa persistência da revisão como JSON"
            git push origin HEAD:fix/triagem-source-of-truth
          fi

      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/triagem-typecheck.log

      - name: Save TypeScript report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: triagem-typecheck-report
          path: /tmp/triagem-typecheck.log
          if-no-files-found: error
          retention-days: 1
