name: Finalize review fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-review-artifact.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preserve metadata and translate labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/_authed.atendimento.$id.tsx")
          source = path.read_text()

          route_marker = '''export const Route = createFileRoute("/_authed/atendimento/$id")({
            component: AttendanceDetail,
          });

          '''
          route_replacement = '''export const Route = createFileRoute("/_authed/atendimento/$id")({
            component: AttendanceDetail,
          });

          const ATTENDANCE_STATUS_LABELS: Record<string, string> = {
            draft: "Rascunho",
            extracting: "Extraindo dados",
            reviewing: "Em revisão",
            done: "Concluído",
            error: "Erro",
          };

          const SUBPROCESS_LABELS: Record<string, string> = {
            jazigo: "Sepultamento em jazigo",
            quadra_geral: "Sepultamento em quadra geral",
          };

          function buildPersistedExtractedData(
            source: unknown,
            fields: Record<string, string>,
            meta: Record<string, FlatFieldMeta>,
          ): Record<string, unknown> {
            const preservedMetadata: Record<string, unknown> = {};
            if (source && typeof source === "object") {
              for (const [key, value] of Object.entries(source as Record<string, unknown>)) {
                if (key.startsWith("_")) preservedMetadata[key] = value;
              }
            }
            return { ...preservedMetadata, ...fields, _visionMeta: meta };
          }

          '''
          if "const ATTENDANCE_STATUS_LABELS" not in source:
              source = source.replace(route_marker, route_replacement, 1)

          old_save = '''  async function saveFields() {
            setSaving(true);
            const { error } = await supabase
              .from("attendances")
              .update({ extracted_data: fields, status: "reviewing" })
              .eq("id", id);
          '''
          new_save = '''  async function saveFields() {
            setSaving(true);
            const persistedData = buildPersistedExtractedData(
              att.extracted_data,
              fields,
              effectiveMeta,
            );
            const { error } = await supabase
              .from("attendances")
              .update({ extracted_data: persistedData, status: "reviewing" })
              .eq("id", id);
          '''
          source = source.replace(old_save, new_save, 1)

          old_generate = '''    await supabase.from("attendances").update({ extracted_data: fields }).eq("id", id);
            setGeneratingId(templateId);
          '''
          new_generate = '''    const persistedData = buildPersistedExtractedData(
              att.extracted_data,
              fields,
              effectiveMeta,
            );
            await supabase
              .from("attendances")
              .update({ extracted_data: persistedData })
              .eq("id", id);
            setGeneratingId(templateId);
          '''
          source = source.replace(old_generate, new_generate, 1)

          old_generate_all = '''    await supabase.from("attendances").update({ extracted_data: fields }).eq("id", id);
            for (const template of applicableTemplates) {
          '''
          new_generate_all = '''    const persistedData = buildPersistedExtractedData(
              att.extracted_data,
              fields,
              effectiveMeta,
            );
            await supabase
              .from("attendances")
              .update({ extracted_data: persistedData })
              .eq("id", id);
            for (const template of applicableTemplates) {
          '''
          source = source.replace(old_generate_all, new_generate_all, 1)

          source = source.replace(
              '''                {att.subprocess}
          ''',
              '''                {SUBPROCESS_LABELS[att.subprocess] ??
                          att.subprocess.replace(/_/g, " ")}
          ''',
              1,
          )
          source = source.replace(
              '''            Status: <span className="font-medium">{att.status}</span>
          ''',
              '''            Status:{" "}
                      <span className="font-medium">
                        {ATTENDANCE_STATUS_LABELS[att.status] ?? att.status}
                      </span>
          ''',
              1,
          )

          path.write_text(source)
          PY

      - name: Format changed files
        run: |
          bunx prettier --write \
            src/components/document-review.tsx \
            src/lib/vision/review-status.ts \
            src/lib/vision/__tests__/review-status.test.ts \
            'src/routes/_authed.atendimento.$id.tsx'

      - name: Validate changed files
        run: |
          bunx eslint \
            src/components/document-review.tsx \
            src/lib/vision/review-status.ts \
            src/lib/vision/__tests__/review-status.test.ts \
            'src/routes/_authed.atendimento.$id.tsx'
          bunx tsc --noEmit
          bunx vitest run src/lib/vision/__tests__/review-status.test.ts

      - name: Commit final files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-review-artifact.yml
          git add \
            src/components/document-review.tsx \
            src/lib/vision/review-status.ts \
            src/lib/vision/__tests__/review-status.test.ts \
            'src/routes/_authed.atendimento.$id.tsx'
          git commit -m "Finaliza correção da revisão documental"
          git push origin HEAD:${{ github.head_ref }}
