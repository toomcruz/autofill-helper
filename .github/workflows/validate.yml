name: Apply official template installer update

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply installer update
        run: python3 scripts/apply-official-template-installer-update.py

      - name: Format and lint route
        run: |
          bunx prettier --write src/routes/_authed.modelos.tsx
          bunx eslint src/routes/_authed.modelos.tsx

      - name: Commit installer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authed.modelos.tsx

          if git diff --cached --quiet; then
            echo "Installer already updated."
            exit 0
          fi

          git commit -m "Refresh existing official templates in Supabase [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
