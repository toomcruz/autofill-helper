name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply formatting in CI workspace
        run: |
          bunx prettier --write \
            .github/workflows/validate.yml \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx

      - name: Package formatted files
        run: |
          tar -czf prettier-output.tar.gz \
            .github/workflows/validate.yml \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx

      - name: Upload formatted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: prettier-output.tar.gz

      - name: Verify formatting produced no changes
        run: git diff --exit-code

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bunx tsc --noEmit

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bunx vitest run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply lint fixes in CI workspace
        run: |
          bunx eslint --fix \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx || true

      - name: Package lint-fixed files
        run: |
          tar -czf eslint-output.tar.gz \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx

      - name: Upload lint-fixed files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-output
          path: eslint-output.tar.gz

      - name: Verify lint
        run: |
          bunx eslint \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx
