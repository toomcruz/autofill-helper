name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: |
          bunx prettier --check \
            .github/workflows/validate.yml \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Lint changed files
        run: |
          bunx eslint \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx
