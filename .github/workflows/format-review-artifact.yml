name: Prepare formatted review files

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-review-artifact.yml
      - src/components/document-review.tsx
      - src/lib/vision/review-status.ts
      - src/lib/vision/__tests__/review-status.test.ts
      - src/routes/_authed.atendimento.$id.tsx

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format review files
        run: |
          bunx prettier --write \
            src/components/document-review.tsx \
            src/lib/vision/review-status.ts \
            src/lib/vision/__tests__/review-status.test.ts \
            'src/routes/_authed.atendimento.$id.tsx'

      - name: Package formatted files
        run: |
          tar -czf formatted-review-files.tar.gz \
            src/components/document-review.tsx \
            src/lib/vision/review-status.ts \
            src/lib/vision/__tests__/review-status.test.ts \
            'src/routes/_authed.atendimento.$id.tsx'

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-review-files
          path: formatted-review-files.tar.gz
          retention-days: 1
