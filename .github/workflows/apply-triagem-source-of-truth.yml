name: Apply triagem source of truth

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/triagem-source-of-truth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/triagem-source-of-truth
          fetch-depth: 0

      - name: Apply codemod
        run: python scripts/apply_triagem_source_of_truth.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and validate focused files
        run: |
          bunx prettier --write \
            src/lib/triagem-sepultamento.ts \
            src/components/triagem-sepultamento.tsx \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/lib/vision/extract-attendance.functions.ts \
            src/lib/attendances.functions.ts \
            src/lib/__tests__/triagem-sepultamento.test.ts
          bunx eslint \
            src/lib/triagem-sepultamento.ts \
            src/components/triagem-sepultamento.tsx \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/lib/vision/extract-attendance.functions.ts \
            src/lib/attendances.functions.ts \
            src/lib/__tests__/triagem-sepultamento.test.ts
          bun test src/lib/__tests__/triagem-sepultamento.test.ts
          bun run typecheck

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No implementation changes."
            exit 0
          fi
          git commit -m "fix: usa triagem como fonte de verdade"
          git push origin HEAD:fix/triagem-source-of-truth
