name: Rebuild official DOCX templates

on:
  push:
    branches:
      - fix/official-docx-print-layouts

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/official-docx-print-layouts
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Rebuild templates
        run: |
          cat scripts/docx_rebuild/*.py > /tmp/rebuild_official_docx.py
          python /tmp/rebuild_official_docx.py

      - name: Remove one-time generator
        run: git rm -r scripts/docx_rebuild .github/workflows/rebuild-official-docx.yml

      - name: Commit generated templates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix: reconstrói modelos oficiais para impressão"
          git push origin HEAD:fix/official-docx-print-layouts
