name: Fix triagem optional attendance

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/triagem-source-of-truth' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/triagem-source-of-truth
          fetch-depth: 0

      - name: Guard optional attendance
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/routes/_authed.atendimento.$id.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = r'(buildPersistedExtractedData\(\s*)att\.extracted_data'
          text, count = re.subn(pattern, r'\1att?.extracted_data', text)
          if count != 3:
              raise SystemExit(f'Esperava corrigir 3 chamadas, corrigi {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and typecheck
        run: |
          bunx prettier --write 'src/routes/_authed.atendimento.$id.tsx'
          bunx tsc --noEmit

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authed.atendimento.$id.tsx'
          git commit -m "fix: protege persistência antes do atendimento carregar"
          git push origin HEAD:fix/triagem-source-of-truth
