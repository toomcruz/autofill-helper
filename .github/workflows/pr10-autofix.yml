name: PR 10 Autoformat

on:
  push:
    branches:
      - fix/separate-burial-agenda-from-attendance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/separate-burial-agenda-from-attendance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and fix lint
        run: |
          bunx prettier --write \
            .github/workflows/validate.yml \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx
          bunx eslint --fix \
            src/lib/docx.server.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/agenda.ts \
            src/lib/attendances.functions.ts \
            src/lib/error-message.ts \
            src/lib/official-templates.ts \
            src/lib/processes.ts \
            'src/routes/_authed.agenda.tsx' \
            'src/routes/_authed.atendimento.$id.tsx' \
            src/routes/_authed.atendimento.novo.tsx \
            src/routes/_authed.modelos.tsx \
            src/routes/_authed.tsx

      - name: Commit fixes and remove helper workflow
        run: |
          rm .github/workflows/pr10-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: aplicar Prettier e ESLint do projeto"
          git push origin HEAD:fix/separate-burial-agenda-from-attendance
