name: Format official DOCX PR

on:
  push:
    branches:
      - fix/official-docx-print-layouts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/official-docx-print-layouts
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and fix lint
        run: |
          bunx prettier --write \
            public/templates/official/catalogo-modelos.json \
            src/lib/official-templates.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/__tests__/official-template-variants.test.ts
          bunx eslint --fix \
            src/lib/official-templates.ts \
            src/lib/__tests__/docx.test.ts \
            src/lib/__tests__/official-template-variants.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/templates/official/catalogo-modelos.json src/lib
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: formata integração dos modelos oficiais"
          git push origin HEAD:fix/official-docx-print-layouts
